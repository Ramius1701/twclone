name: Windows server
on:
  push:
    branches: [codex/windows-server]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@v7
        with:
          packages: gcc-core make autoconf automake libpq-devel libssl-devel libreadline-devel libjansson-devel libargon2_1 postgresql postgresql-client python312 python312-devel python312-pip
      - name: Build and test on Windows
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail {0}
        run: |
          export PATH="/usr/bin:$PATH"
          autoreconf -fi
          ./configure --enable-postgres
          make clean
          make -j2 SANITIZE_FLAGS=
          staging="$PWD/twclone-windows-x64"
          bash tools/windows/package.sh "$staging"
          powershell.exe -NoProfile -Command 'Compress-Archive -Path twclone-windows-x64 -DestinationPath twclone-windows-x64.zip; Expand-Archive -Path twclone-windows-x64.zip -DestinationPath "package check"'
          package="$PWD/package check/twclone-windows-x64"
          export BIGBANG_BIN="$package/bin/bigbang.exe"
          export SERVER_BIN="$package/bin/server.exe"
          export ECON_QA_SQL_DIR="$package/sql/pg"
          pg_bin=$(dirname "$(find /usr -name initdb.exe -print -quit)")
          test -x "$pg_bin/initdb.exe"
          export PATH="$pg_bin:$PATH"
          /usr/sbin/cygserver.exe &
          cygserver_pid=$!
          sleep 2
          kill -0 "$cygserver_pid"
          qa_dir=$(mktemp -d)
          trap 'pg_ctl -D "$qa_dir/data" -m fast stop || true; kill "$cygserver_pid" || true; rm -rf -- "$qa_dir"' EXIT
          initdb -D "$qa_dir/data" -U twclone_qa -A trust --encoding=UTF8
          pg_ctl -D "$qa_dir/data" -l "$qa_dir/postgres.log" -o "-h 127.0.0.1 -p 55432" -w start
          export ECON_QA_DATABASE=twclone_econ_qa_windows
          export ECON_QA_ADMIN_DSN="host=127.0.0.1 port=55432 user=twclone_qa dbname=postgres"
          export ECON_QA_APP_TEMPLATE="host=127.0.0.1 port=55432 user=twclone_qa dbname=%DB%"
          python3.12 -m pip install --target "$qa_dir/pydeps" psycopg2
          export PYTHONPATH="$qa_dir/pydeps"
          python3.12 tests.v2/test_pg_bigbang_economy_profit.py
      - uses: actions/upload-artifact@v4
        with:
          name: twclone-windows-x64
          path: twclone-windows-x64.zip
          if-no-files-found: error
