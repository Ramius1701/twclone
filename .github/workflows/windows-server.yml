name: Windows server
on:
  push:
    branches: [codex/windows-server]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@v7
        with:
          packages: gcc-core make autoconf automake libpq-devel libssl-devel libreadline-devel libjansson-devel libargon2_1 postgresql postgresql-client python312 python312-devel python312-pip
      - name: Build and test on Windows
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail {0}
        run: |
          export PATH="/usr/bin:$PATH"
          autoreconf -fi
          ./configure --enable-postgres
          make clean
          make -j2 SANITIZE_FLAGS=
          pg_bin=$(dirname "$(find /usr -name initdb.exe -print -quit)")
          test -x "$pg_bin/initdb.exe"
          export PATH="$pg_bin:$PATH"
          qa_dir=$(mktemp -d)
          trap 'pg_ctl -D "$qa_dir/data" -m fast stop || true; rm -rf -- "$qa_dir"' EXIT
          initdb -D "$qa_dir/data" -U twclone_qa -A trust
          pg_ctl -D "$qa_dir/data" -l "$qa_dir/postgres.log" -o "-h 127.0.0.1 -p 55432" -w start
          export ECON_QA_DATABASE=twclone_econ_qa_windows
          export ECON_QA_ADMIN_DSN="host=127.0.0.1 port=55432 user=twclone_qa dbname=postgres"
          export ECON_QA_APP_TEMPLATE="host=127.0.0.1 port=55432 user=twclone_qa dbname=%DB%"
          python3.12 -m venv "$qa_dir/venv"
          "$qa_dir/venv/bin/python" -m pip install psycopg2
          "$qa_dir/venv/bin/python" tests.v2/test_pg_bigbang_economy_profit.py
